<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PICKR — Ta bibliothèque de jeux</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">

  <!-- 2 polices : Silkscreen (logo) + Archivo (titres et texte, avec axe de largeur) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Silkscreen&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="entete">
    <h1 class="logo">PICKR</h1>
    <p class="entete__compteur">50 jeux · toutes plateformes</p>

    <form class="recherche" role="search" action="#">
      <label for="recherche" class="sr-only">Rechercher un jeu par titre</label>
      <input type="search" id="recherche" name="q" class="recherche__champ" placeholder="Rechercher un jeu…">
    </form>
  </header>

  <main class="page">

    <!-- FILTRES : barre fixe en bas sur mobile, barre latérale dès 700px -->
    <form class="filtres" aria-labelledby="titre-filtres" action="#">
      <h2 id="titre-filtres" class="filtres__titre">Filtres</h2>

      <fieldset class="plateformes">
        <legend class="filtres__groupe sr-only-mobile">Plateforme</legend>

        <input type="radio" name="plateforme" id="pf-tous" value="tous" class="sr-only" checked>
        <label for="pf-tous" class="plateforme">Tous</label>

        <input type="radio" name="plateforme" id="pf-switch" value="switch" class="sr-only">
        <label for="pf-switch" class="plateforme">Switch</label>

        <input type="radio" name="plateforme" id="pf-ps5" value="ps5" class="sr-only">
        <label for="pf-ps5" class="plateforme">PS5</label>

        <input type="radio" name="plateforme" id="pf-pc" value="pc" class="sr-only">
        <label for="pf-pc" class="plateforme">PC</label>
      </fieldset>

      <p class="filtres__groupe filtres__desktop">Affiner</p>

      <!-- name="panneau" : un seul panneau ouvert à la fois, sans JS -->
      <details class="panneau" name="panneau">
        <summary class="panneau__bouton">
          <span class="texte-mobile">Statut</span><span class="texte-desktop">Tous les statuts</span>
        </summary>
        <fieldset class="panneau__contenu">
          <legend class="sr-only">Statut</legend>
          <label><input type="radio" name="statut" value="tous" checked> Tous</label>
          <label><input type="radio" name="statut" value="a-jouer"> À jouer</label>
          <label><input type="radio" name="statut" value="en-cours"> En cours</label>
          <label><input type="radio" name="statut" value="termine"> Terminé</label>
          <label><input type="radio" name="statut" value="abandonne"> Abandonné</label>
        </fieldset>
      </details>

      <details class="panneau" name="panneau">
        <summary class="panneau__bouton">
          <span class="texte-mobile">Durée</span><span class="texte-desktop">Toutes les durées</span>
        </summary>
        <fieldset class="panneau__contenu">
          <legend class="sr-only">Durée estimée</legend>
          <label><input type="radio" name="duree" value="toutes" checked> Toutes</label>
          <label><input type="radio" name="duree" value="moins-10"> &lt;10h</label>
          <label><input type="radio" name="duree" value="10-20"> 10h-20h</label>
          <label><input type="radio" name="duree" value="20-40"> 20-40h</label>
          <label><input type="radio" name="duree" value="plus-40"> &gt;40h</label>
        </fieldset>
      </details>

      <details class="panneau" name="panneau">
        <summary class="panneau__bouton">
          <span class="texte-mobile">Genre</span><span class="texte-desktop">Tous les genres</span>
        </summary>
        <fieldset class="panneau__contenu">
          <legend class="sr-only">Genre</legend>
          <label><input type="radio" name="genre" value="tous" checked> Tous</label>
          <label><input type="radio" name="genre" value="action"> Action</label>
          <label><input type="radio" name="genre" value="aventure"> Aventure</label>
          <label><input type="radio" name="genre" value="gestion"> Gestion</label>
          <label><input type="radio" name="genre" value="puzzle"> Puzzle</label>
          <label><input type="radio" name="genre" value="rpg"> RPG</label>
        </fieldset>
      </details>

      <p class="filtres__groupe filtres__desktop">Trier par</p>

      <details class="panneau" name="panneau">
        <summary class="panneau__bouton">
          <span class="texte-mobile">Tri</span><span class="texte-desktop">Plus récents</span>
        </summary>
        <fieldset class="panneau__contenu">
          <legend class="sr-only">Trier par</legend>
          <label><input type="radio" name="tri" value="recents" checked> Plus récents</label>
          <label><input type="radio" name="tri" value="courts"> Plus courts d'abord</label>
          <label><input type="radio" name="tri" value="longs"> Plus longs d'abord</label>
        </fieldset>
      </details>

      <!-- type="reset" remet tous les filtres à zéro sans JS -->
      <button type="reset" class="filtres__effacer filtres__desktop">Effacer les filtres</button>
    </form>

    <!-- LISTE DES JEUX -->
    <section class="bibliotheque" aria-labelledby="titre-liste">
      <div class="bibliotheque__entete sr-only-mobile">
        <h2 id="titre-liste" class="bibliotheque__titre">50 jeux</h2>
        <p class="bibliotheque__tri">Trié par : plus récents</p>
      </div>

      <section id="liste-cartes" class="cartes-grille cartes">
        <!-- Les cartes seront injectées ici par app.js -->
      </section>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
